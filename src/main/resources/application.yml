spring:
  application:
    name: booknest-lite
  datasource:
    url: jdbc:postgresql://localhost:5432/booknest
    username: booknest
    password: booknest
  jpa:
    hibernate:
      ddl-auto: validate        # fine for learning; switch to Flyway later
    show-sql: true            # watch the SQL Hibernate generates
    properties:
      hibernate.format_sql: true
    open-in-view: false

app:
  library:
    loan-days: 14
    max-active-loans: 3
